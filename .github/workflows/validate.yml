name: Validate site
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-test.mjs --compact-only
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-entry-checks
          path: |
            test-results/compact-entry/
            test-results/part-search/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          # These paths are already preserved in compact-entry-checks.
          path: |
            test-results/
            !test-results/compact-entry/**
            !test-results/part-search/**
          retention-days: 7
