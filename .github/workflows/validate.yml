name: Validate site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-nojs-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nojs-diagnostic
          path: test-results/nojs-diagnostic/
          retention-days: 7
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
